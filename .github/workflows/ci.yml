name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    # NOTE: hashFiles() is not available in jobs.<job_id>.if — GitHub
    # rejects the whole workflow at parse time. Check out first, then
    # gate each step on file presence so this workflow stays green both
    # before and after the Rust workspace lands (Issue #1).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check workspace presence
        id: check_files
        run: |
          if [ -f Cargo.toml ]; then echo "has_cargo=true"; else echo "has_cargo=false"; fi >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: steps.check_files.outputs.has_cargo == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check_files.outputs.has_cargo == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        if: steps.check_files.outputs.has_cargo == 'true'

      - name: Check formatting
        if: steps.check_files.outputs.has_cargo == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        if: steps.check_files.outputs.has_cargo == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        if: steps.check_files.outputs.has_cargo == 'true'
        run: cargo test --workspace

  python:
    name: Python (ruff + pytest)
    # Same hashFiles note as above: gate steps, not the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check backend presence
        id: check_files
        run: |
          if [ -f python-backend/pyproject.toml ]; then echo "has_pyproject=true"; else echo "has_pyproject=false"; fi >> "$GITHUB_OUTPUT"
          if [ -d python-backend/tests ]; then echo "has_pytests=true"; else echo "has_pytests=false"; fi >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check_files.outputs.has_pyproject == 'true'
        with:
          python-version: "3.11"

      - name: Install ruff and pytest
        if: steps.check_files.outputs.has_pyproject == 'true'
        run: pip install ruff pytest

      - name: Ruff lint
        if: steps.check_files.outputs.has_pyproject == 'true'
        run: ruff check python-backend/

      - name: Ruff format check
        if: steps.check_files.outputs.has_pyproject == 'true'
        run: ruff format --check python-backend/

      - name: Run Python tests
        # No tests directory exists yet; runs automatically once one lands.
        if: steps.check_files.outputs.has_pytests == 'true'
        run: pytest python-backend/tests
